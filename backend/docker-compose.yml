services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hugomarket}
      POSTGRES_USER: ${POSTGRES_USER:-hugomarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hugomarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-hugomarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hugomarket}
      PEPPER: ${PEPPER:?set PEPPER in .env}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.0.1}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
