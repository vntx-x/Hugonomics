services:
  monitor:
    build:
      context: .
      args:
        UID: ${MC_UID:-1000}
    image: hugonomics-monitor
    restart: unless-stopped
    environment:
      MC_VERSION: ${MC_VERSION:-1.21.5}
      MC_LOGIN: ${MC_LOGIN}
      MC_SERVER: ${MC_SERVER:-hugosmp.net}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx2G -Xms512M -XX:+UseSerialGC}
    volumes:
      - ./data:/home/mc/data
      - ./mods:/home/mc/mods:ro
      - ./config.json:/home/mc/config.json:ro
    deploy:
      resources:
        limits:
          memory: 2816m
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
